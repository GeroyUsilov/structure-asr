# Low-temperature forward generation: does conservative AA resampling keep the
# fold intact at high mu? Reconstruction stages only (no [sample]); the readouts
# are per-tip 3Di composition and AA/3Di MAP accuracy.
[grid]
name = "tau_low"
outdir = "../results/grids/tau_low"
tree = "../examples/ef_tu/reference/AB_eftu_rerooted.tre"
alignment = "../examples/ef_tu/reference/EFTu_all_alignment.fasta"
root_accession = "163840912"
rates = [2, 4, 8]
proposal_temperatures = [0.5]
seeds = [731024]
model_name = "facebook/esm2_t33_650M_UR50D"
dtype = "float16"
max_attempts_per_cell = 100000

[asr]
iqtree = "iqtree3"              # or set ASR_IQTREE / pass --iqtree
threads_per_job = 1
aa_model = "MFP"                # ModelFinder, BIC
three_di_matrix = "../.cache/models/3di/Q.3Di.AF"   # scripts/fetch_3di_matrix.sh
three_di_model_name = "Q3DI_AF"

# lambda = 0 is the drift control: at 85-95% AA MAP accuracy the chain has much
# more room to wander than the mu=1 cells did. lambda up to 1 because the
# divergence diagnostic put the truth-vs-MAP crossover near 0.2-6.8, above the
# 0.1 ceiling scanned there; lambda=1 at T=4 is the legacy alpha=.5 equivalent.
[sample]
structural_lambdas = [0, 0.02, 0.1, 0.5, 1]
nodes = ["Node1", "Node29", "Node34"]
n_iter = 1000
chains_per_node = 1
mcmc_temperature = 2
site_uncertainty_mixture = 0.9
