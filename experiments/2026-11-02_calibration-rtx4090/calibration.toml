# Timing calibration: one cell end to end, then 20 sampler steps. See WORKFLOWS "Multi-regime grids".
[grid]
name = "calibration"
outdir = "../results/grids/calibration"
tree = "../examples/ef_tu/reference/AB_eftu_rerooted.tre"
alignment = "../examples/ef_tu/reference/EFTu_all_alignment.fasta"
root_accession = "163840912"
rates = [1]
proposal_temperatures = [1.5]
seeds = [731024]
model_name = "facebook/esm2_t33_650M_UR50D"
dtype = "float16"
max_attempts_per_cell = 100000

[asr]
iqtree = "iqtree3"              # or set ASR_IQTREE / pass --iqtree
threads_per_job = 1
aa_model = "MFP"                # ModelFinder, BIC
three_di_matrix = "../.cache/models/3di/Q.3Di.AF"   # scripts/fetch_3di_matrix.sh
three_di_model_name = "Q3DI_AF"

[sample]
# Enough chains to fill a ProstT5 batch; sample_timings_*.tsv gives seconds per step.
structural_lambdas = [0.02, 0.1]
nodes = "all"                   # 37 nodes x 2 lambdas = 74 chains per step
n_iter = 20
chains_per_node = 1
mcmc_temperature = 2
site_uncertainty_mixture = 0.9
